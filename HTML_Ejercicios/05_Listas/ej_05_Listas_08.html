<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio 8 - Lista de definición</title>
  </head>

  <body>
    <!-- Este último ejercicio es diferente. Tenemos tres categorías:
            Primeros
            Segundos
            Postres
        Y debajo de cada categoría aparecen sus platos.
        La estructura adecuada es una lista de definición mediante <dl>, <dt> y <dd>.
    -->
    <h1>Menú del Día</h1>

    <dl>
      <dt>Primeros</dt>

      <dd>Ensalada mixta con lechuga, tomate, cebolla y aceitunas</dd>
      <dd>Crema de calabaza</dd>
      <dd>Paella de verduras</dd>

      <dt>Segundos</dt>

      <dd>Pollo asado</dd>
      <dd>Merluza a la plancha</dd>
      <dd>Filete de ternera</dd>

      <dt>Postres</dt>

      <dd>Flan casero</dd>
      <dd>Tarta de queso</dd>
      <dd>Fruta de temporada</dd>
    </dl>
  </body>
</html>
