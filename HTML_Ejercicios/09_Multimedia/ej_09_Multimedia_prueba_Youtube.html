<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prueba de YouTube</title>
  </head>
  <body>
    <h1>Prueba de YouTube</h1>

    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/M7lc1UVf-VE"
      title="YouTube video player"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      allowfullscreen
    >
    </iframe>
  </body>
</html>
