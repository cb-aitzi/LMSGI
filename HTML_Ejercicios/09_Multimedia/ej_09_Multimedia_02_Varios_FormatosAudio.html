<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Varios formatos de audio</title>
  </head>
  <body>
    <h1>Reproducir varios formatos de audio</h1>
    
    <!-- El atributo controls hace que aparezcan los controles del reproductor.-->
    <audio controls loop preload="metadata">
      <!-- <source> permite proporcionar diferentes versiones del mismo recurso multimedia. -->
      <!-- El navegador utilizará la primera que sea compatible. -->
      <source src="audio/audio1.mp3" type="audio/mpeg" />

      <source src="audio/audio2.ogg" type="audio/ogg" />

      Tu navegador no soporta este tipo de audio.
    </audio>
  </body>
</html>
