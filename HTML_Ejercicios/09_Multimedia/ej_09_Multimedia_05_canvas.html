<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo canvas</title>
  </head>
  <body>
    <!-- La etiqueta <canvas> crea un lienzo en el que se pueden dibujar gráficos dinámicamente mediante JavaScript. El propio documento señala que la etiqueta crea el área de dibujo, mientras que JavaScript realiza realmente el trabajo. -->
    <canvas id="miCanvas" width="400" height="300"> </canvas>

    <!-- Pero esto por sí solo no dibuja nada. Podemos visualizarlo mejor añadiendo un borde-->
    <canvas
      id="miCanvas"
      width="400"
      height="300"
      style="border: 1px solid black"
    >
    </canvas>
  </body>
</html>
