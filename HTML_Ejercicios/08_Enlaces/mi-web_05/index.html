<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Enlace mixto</title>
  </head>

  <body>
    <!-- Un enlace mixto combina:
            otra página
            y una sección concreta de esa página.
    -->
    <h1>Inicio</h1>

    <a href="informacion.html#horarios"> Ver horarios </a>
    <br />

    <!-- Los enlaces no tienen por qué llevar únicamente a páginas HTML. -->
    <!-- Al pulsar sobre el enlace, el navegador accederá al PDF. -->
    <a href="documentos/2.6. Enlaces.pdf"> Descargar Tema 1 </a>
    <br />

    <!-- También podemos hacer que una imagen sea el enlace. -->
    <a href="https://www.google.com">
      <img src="img/google.png" alt="Google" />
    </a>
    <br />

    <!-- Enlace de correo electrónico -->
    <a href="mailto:profe@ejemplo.com"> Enviar correo </a>
    <br />

    <!-- También podemos hacerlo con una imagen -->
    <a href="mailto:profesor@ejemplo.com">
      <img src="img/email.png" alt="Enviar correo" />
    </a>

    <!-- Diferencia entre ruta absoluta y relativa -->
    <!-- Ruta absoluta -->
    <a href="C:/Users/Aitziber/Documents/web/contacto.html"> Contacto </a>
    <!-- Ruta relativa -->
    <a href="contacto.html"> Contacto </a>
  </body>
</html>
