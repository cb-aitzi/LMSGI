<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo - span vs div</title>
  </head>
  <body>
    <div style="background-color: lightblue; text-align: center;">DIV 1</div>

    <div style="background-color: lightgreen">DIV 2</div>

    <p>
      Texto antes
      <span style="background-color: yellow">SPAN 1</span>
      texto después
      <span style="background-color: orange">SPAN 2</span>
    </p>
  </body>
</html>
