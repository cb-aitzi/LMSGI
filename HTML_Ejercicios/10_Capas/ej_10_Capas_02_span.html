<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo - span</title>
  </head>
  <body>
    <!-- El <span> no rompe el párrafo. Podemos utilizarlo para destacar una parte concreta:-->
    <p>
      Este texto contiene
      <span style="color: red">una palabra en rojo</span>
      dentro del mismo párrafo.
    </p>
  </body>
</html>
