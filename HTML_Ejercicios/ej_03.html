<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio 3</title>
  </head>

  <body>
    <!-- Título de la página -->
    <h1>Caracteres especiales</h1>

    <!--
        Utilizamos entidades HTML para mostrar
        caracteres que tienen un significado especial en HTML.
    -->
    <p>El símbolo menor que es: &lt;</p>

    <p>El símbolo mayor que es: &gt;</p>

    <p>El símbolo ampersand es: &amp;</p>

    <!-- También podemos utilizar los tres caracteres juntos -->
    <p>&lt;html&gt; &amp; &lt;/html&gt;</p>
  </body>
</html>
