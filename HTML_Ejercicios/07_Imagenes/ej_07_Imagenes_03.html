<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Tamaño de imágenes</title>
  </head>

  <body>
    <!-- Podemos utilizar width y height para modificar las dimensiones de la imagen. Si utilizamos solamente uno, el otro se adapta para mantener la proporción. -->
    <h1>Imagen de 200 píxeles de ancho</h1>

    <img src="img/cafe.jpg" alt="Taza de café" width="200" />
  </body>
</html>
