<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Imagen con texto alternativo ALT</title>
  </head>

  <body>
    <!-- El atributo alt permite proporcionar un texto alternativo si la imagen no puede visualizarse y también resulta importante para usuarios que utilizan lectores de pantalla -->
    <h1>Una taza de café</h1>

    <img src="img/cafe.jpg" alt="Taza de café" />
    <!-- La imagen no se mostrará, pero el navegador podrá utilizar el texto: Taza de café-->
    <img src="img/cafe123.png" alt="Taza de café">
  </body>
</html>
