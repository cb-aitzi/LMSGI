<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo - object</title>
  </head>
  <body>
    <h1>La etiqueta &lt;object&gt; en HTML</h1>
    <h3>
      La etiqueta &lt;object&gt; se usa para incrustar diferentes tipos de
      contenido como PDFs, imágenes, vídeos, etc. Se pueden hacer uso de los
      siguientes atributos:
    </h3>
    <!-- Incrustar un archivo PDF en la página -->
    <object data="documentos/2.6. Enlaces.pdf" type="application/pdf" width="600" height="400">
      <!-- Mensaje alternativo si no se puede mostrar el PDF -->
      Tu navegador no admite la visualización de archivos PDF.
      <a href="documentos/2.6. Enlaces.pdf">Haz clic aquí para descargar el archivo.</a>
    </object>
  </body>
</html>
