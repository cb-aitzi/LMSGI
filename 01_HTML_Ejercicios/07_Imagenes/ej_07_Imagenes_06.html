<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Imagen y salto de línea</title>
  </head>

  <body>
    <!-- Una imagen se comporta de forma similar al texto en cuanto a su posición en la línea. Podemos utilizar <br> para introducir un salto de línea. -->
    <p>
      Esta es una taza de café:
      <img src="img/cafe.jpg" alt="Taza de café" width="100" />
    </p>

    <br />

    <p>
      Esta es otra taza:
      <img src="img/cafe.jpg" alt="Taza de café" width="100" />
    </p>
  </body>
</html>
