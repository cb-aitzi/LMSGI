<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Reutilizar imágenes</title>
  </head>

  <body>
    <!-- Una misma imagen puede utilizarse varias veces en una página. No necesitamos tener tres copias del archivo. -->
    <h1>Café</h1>

    <img src="img/cafe.jpg" alt="Café" />

    <h2>Otra vez el café</h2>

    <img src="img/cafe.jpg" alt="Café" />

    <h2>Y otra vez...</h2>

    <img src="img/cafe.jpg" alt="Café" />
  </body>
</html>
