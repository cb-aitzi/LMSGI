<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo div</title>
  </head>
  <body>
    <!-- <div> no dibuja una caja automáticamente. Es un contenedor -->
    <div>
      <h1>Mi página</h1>
      <p>Este contenido está dentro de un div.</p>
    </div>

    <!-- Podemos ponerle un fondo -->
    <div style="background-color: lightblue">
      <h2>Noticias</h2>
      <p>Estas son las noticias de hoy.</p>
    </div>

    <!-- Podemos añadir un borde y espacio interior -->
    <div
      style="
        background-color: lightgreen;
        border: 2px solid green;
        padding: 20px;
      "
    >
      <h3>Noticias de hoy</h3>
      <p>Estas son las noticias de hoy.</p>
    </div>
  </body>
</html>
