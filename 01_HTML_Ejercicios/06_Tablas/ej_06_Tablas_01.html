<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio 1 - Tabla 3×4 con cabeceras horizontales</title>
  </head>

  <body>
    <!-- 
        <table> → crea la tabla.
        <tr> → crea una fila.
        <th> → crea una celda de cabecera.
        <td> → crea una celda de datos.
    -->
    <table border="1">
      <tr>
        <th>Nombre</th>
        <th>Primer Apellido</th>
        <th>Segundo Apellido</th>
        <th>Edad</th>
      </tr>

      <tr>
        <td>Ana</td>
        <td>Pérez</td>
        <td>García</td>
        <td>25</td>
      </tr>

      <tr>
        <td>Carlos</td>
        <td>Rodríguez</td>
        <td>Martínez</td>
        <td>30</td>
      </tr>

      <tr>
        <td>Lucía</td>
        <td>López</td>
        <td>Fernández</td>
        <td>22</td>
      </tr>
    </table>
  </body>
</html>
